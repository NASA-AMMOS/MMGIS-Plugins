name: Agent Capability Tests

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # Tested development baseline for the unmerged host dependency below.
  # Keep the base and overlay pinned together; advance them after #1045 merges.
  HOST_BASE_COMMIT: "8f5cb2acf725b0b03494630cbdc96a7af53b9b9e"
  # Temporary exact pins for https://github.com/NASA-AMMOS/MMGIS/pull/1045.
  # Remove the overlay after that host dependency merges into development.
  HOST_REGISTRY_COMMIT: "a374d18fc1cf6a32e908c75d50d36ce779fa78ee"
  HOST_AUTH_COMMIT: "074812feee52d733bf182da28cb64dc142ef2a09"
  HOST_COPILOT_BRANCH: "agent/copilot-api-registry"

jobs:
  agent-unit:
    name: Agent, AgentChat, and host contract units
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout pinned MMGIS development host
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: NASA-AMMOS/MMGIS
          ref: ${{ env.HOST_BASE_COMMIT }}
          path: mmgis
          persist-credentials: false

      - name: Overlay the pinned host Copilot API commits
        working-directory: mmgis
        run: |
          git fetch --no-tags https://github.com/midatm1234/MMGIS.git \
            "+refs/heads/${HOST_COPILOT_BRANCH}:refs/remotes/copilot-host/${HOST_COPILOT_BRANCH}"
          git cat-file -e "${HOST_REGISTRY_COMMIT}^{commit}"
          git cat-file -e "${HOST_AUTH_COMMIT}^{commit}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git cherry-pick "${HOST_REGISTRY_COMMIT}" "${HOST_AUTH_COMMIT}"

      - name: Checkout this plugin container
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: mmgis/plugins/NASA-AMMOS--MMGIS-Plugins
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mmgis/package-lock.json

      - name: Install MMGIS and plugin dependencies
        # The pinned host has a ranged svgo override; npm 10 re-resolves it
        # against the registry and rejects its own lockfile after new releases.
        # Match the existing lock entry without regenerating the host lockfile.
        run: |
          npm pkg set overrides.svgo=3.3.4
          npm ci
        working-directory: mmgis

      - name: Verify aggregated plugin dependencies
        run: npm run plugins:install
        working-directory: mmgis

      - name: Install Playwright Chromium
        # Hosted Ubuntu already includes Chrome's system libraries. Avoid an
        # unrelated apt refresh; Playwright still installs its pinned browser.
        run: npx playwright install chromium
        working-directory: mmgis

      - name: Run pinned host contract tests
        run: >-
          npx playwright test
          tests/unit/copilotActionRegistry.spec.js
          tests/unit/apiAuthentication.spec.js
          --workers=1 --project=chromium --reporter=list,json
        working-directory: mmgis
        env:
          PLAYWRIGHT_TEST_UNIT_ONLY: "true"
          PLAYWRIGHT_JSON_OUTPUT_FILE: host-contract-results.json

      - name: Require executed host contract tests
        run: >-
          node -e 'const s=require("./host-contract-results.json").stats;
          if(!(s.expected>0)||s.skipped!==0||s.unexpected!==0||s.flaky!==0){console.error(s);process.exit(1)}'
        working-directory: mmgis

      - name: Run Agent and AgentChat unit tests
        run: >-
          npx playwright test
          plugins/NASA-AMMOS--MMGIS-Plugins/backend/Agent/tests
          plugins/NASA-AMMOS--MMGIS-Plugins/tools/AgentChat/tests
          --grep '@unit' --workers=1 --project=chromium --reporter=list,json
        working-directory: mmgis
        env:
          AUTH: "off"
          PLAYWRIGHT_TEST_UNIT_ONLY: "true"
          PLAYWRIGHT_JSON_OUTPUT_FILE: plugin-unit-results.json

      - name: Require executed, unskipped plugin unit tests
        run: >-
          node -e 'const s=require("./plugin-unit-results.json").stats;
          if(!(s.expected>0)||s.skipped!==0||s.unexpected!==0||s.flaky!==0){console.error(s);process.exit(1)}'
        working-directory: mmgis

  agent-raster:
    name: Agent raster integration (2 required tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout pinned MMGIS development host
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: NASA-AMMOS/MMGIS
          ref: ${{ env.HOST_BASE_COMMIT }}
          path: mmgis
          persist-credentials: false

      - name: Overlay the pinned host Copilot API commits
        working-directory: mmgis
        run: |
          git fetch --no-tags https://github.com/midatm1234/MMGIS.git \
            "+refs/heads/${HOST_COPILOT_BRANCH}:refs/remotes/copilot-host/${HOST_COPILOT_BRANCH}"
          git cat-file -e "${HOST_REGISTRY_COMMIT}^{commit}"
          git cat-file -e "${HOST_AUTH_COMMIT}^{commit}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git cherry-pick "${HOST_REGISTRY_COMMIT}" "${HOST_AUTH_COMMIT}"

      - name: Checkout this plugin container
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: mmgis/plugins/NASA-AMMOS--MMGIS-Plugins
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mmgis/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install MMGIS and plugin dependencies
        # Keep the same lockfile-compatible override as the unit job above.
        run: |
          npm pkg set overrides.svgo=3.3.4
          npm ci
        working-directory: mmgis

      - name: Generate and verify plugin dependency manifests
        run: |
          npm run plugins:install
          test -s plugin-python-requirements.txt
          grep -Fx 'numpy==2.1.0' plugin-python-requirements.txt
          grep -Fx 'rasterio==1.5.1' plugin-python-requirements.txt
        working-directory: mmgis

      - name: Install and smoke-test exact raster dependencies
        run: |
          python -m pip install -r plugin-python-requirements.txt
          python -c "import numpy, rasterio; assert numpy.__version__ == '2.1.0'; assert rasterio.__version__ == '1.5.1'"
        working-directory: mmgis

      - name: Run both raster integration specs
        run: >-
          npx playwright test
          plugins/NASA-AMMOS--MMGIS-Plugins/backend/Agent/tests/rasterDifference.spec.js
          plugins/NASA-AMMOS--MMGIS-Plugins/backend/Agent/tests/rasterStatistics.spec.js
          --grep '@integration' --workers=1 --project=chromium --reporter=list,json
        working-directory: mmgis
        env:
          PLAYWRIGHT_TEST_UNIT_ONLY: "true"
          MMGIS_RUN_RASTER_INTEGRATION: "true"
          MMGIS_PYTHON: python
          PLAYWRIGHT_JSON_OUTPUT_FILE: raster-results.json

      - name: Require exactly two passing, unskipped raster tests
        run: >-
          node -e 'const s=require("./raster-results.json").stats;
          if(s.expected!==2||s.skipped!==0||s.unexpected!==0||s.flaky!==0){console.error(s);process.exit(1)}'
        working-directory: mmgis
