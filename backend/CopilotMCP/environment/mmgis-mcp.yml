# micromamba environment for MMGIS (development @ c576fe49) + MMGIS-Plugins + Copilot MCP.
# Derived from MMGIS python-environment.yml (python 3.12, gdal 3.12.2, pip pins),
# MMGIS .nvmrc (node 22.20.0 -> 22.21.1, the closest conda-forge osx-arm64 build; package docs require >=22),
# README (PostgreSQL 16+ with PostGIS) and the MMGIS-Plugins Agent manifest (rasterio>=1.3).
name: mmgis-mcp
channels:
  - conda-forge
dependencies:
  - python=3.12
  - gdal=3.12.2
  - geos
  - proj
  - attrs
  - certifi
  - click
  - cligj
  - click-plugins
  - snuggs
  - affine
  - pyparsing
  - colorama
  - pip
  - nodejs=22.21.1
  # PostGIS 3.6.2 build h8050a39_1 is the newest build linked against libgdal-core 3.12.x (matches gdal 3.12.2)
  - postgresql=18
  - postgis=3.6.2=h8050a39_1
  - pip:
      - rasterio>=1.5.0
      - numpy>=2.0.0
      - numba>=0.60.0
      - requests==2.33.0
      - rio_stac>=0.12.0
      - spiceypy==5.1.2
      - pymap3d==3.0.1
      - pypgstac==0.9.6
      - python-dotenv[cli]==1.0.1
      - uvicorn==0.30.6
      - psycopg[binary,pool]==3.2.1
      - stac-fastapi-pgstac==6.2.2
      - stac-fastapi-api==6.2.1
      - stac-fastapi-types==6.2.1
      - stac-fastapi-extensions==6.2.1
      - tipg==1.6.1
      - titiler.application==2.2.0
      - titiler-pgstac==3.1.0
      - rio-tiler>=9.4,<10.0
      - antimeridian==0.3.10
